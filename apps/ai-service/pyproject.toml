[project]
name = "agro-vision"
version = "0.1.0"
description = "AgroGarantías — servicio de visión computacional (análisis de imágenes, conteo, detección de cambios)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.142.2,<0.143",
  "uvicorn>=0.54.0,<0.55",
  "python-multipart>=0.0.32,<0.1",
  "opencv-python-headless>=5.0.0.93,<5.1",
  "numpy>=2.5.3,<2.6",
  "pillow>=12.3.0,<13",
  "pydantic-settings>=2.15.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "httpx2>=2.13.1,<3",
  "ruff>=0.16.9,<0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agro_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S311"]
"scripts/*" = ["S311"]
