# AgroGarantías — entorno local completo.
#
# Puertos publicados en el host: web (3000), API (4000) y MinIO (9000/9001), configurables con
# WEB_PORT, API_PORT, MINIO_PORT y MINIO_CONSOLE_PORT. PostgreSQL, Redis y el servicio de visión
# sólo son accesibles dentro de la red de compose (para desarrollo local sin Docker, ver
# docker-compose.dev.yml).
#
# Los valores por defecto (${VAR:-valor}) son SOLO para desarrollo local. Para cualquier otro
# entorno, definí las variables en un archivo .env (ver .env.example). La API se niega a
# iniciar en NODE_ENV=production si detecta secretos de desarrollo.

name: agrogarantias

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-agro}:${POSTGRES_PASSWORD:-agro_dev_password}@postgres:5432/${POSTGRES_DB:-agrogarantias}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-agrogarantias}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-agro_minio}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-agro_minio_dev_secret}
  S3_FORCE_PATH_STYLE: "true"
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-insecure-jwt-secret-change-me-0001}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
  AI_SERVICE_URL: http://ai-service:8000
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-ai-service-token}
  CV_PROVIDER: ${CV_PROVIDER:-ai-service}
  # stac = Sentinel-2 L2A real (sin credenciales) · mock = serie SIMULADA
  SATELLITE_PROVIDER: ${SATELLITE_PROVIDER:-stac}
  AI_SERVICE_SATELLITE_TIMEOUT_MS: ${AI_SERVICE_SATELLITE_TIMEOUT_MS:-180000}
  CAMERA_GATEWAY: ${CAMERA_GATEWAY:-simulated}
  REGISTRY_PROVIDER: ${REGISTRY_PROVIDER:-mock}
  MONITORING_TICK_SECONDS: ${MONITORING_TICK_SECONDS:-300}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
  RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-AgroDemo2026!}
  # Imágenes y documentos de demostración (copiados en la imagen de la API).
  SEED_ASSETS_DIR: /app/seed-assets
  # "Simular solicitud": enabled | disabled
  DEMO_MODE: ${DEMO_MODE:-enabled}

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrogarantias}
      POSTGRES_USER: ${POSTGRES_USER:-agro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agro_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO compilado desde el código fuente por Chainguard (MinIO dejó de publicar imágenes
  # oficiales en Docker Hub en 2026). Cualquier almacenamiento S3-compatible funciona.
  minio:
    image: chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agro_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agro_minio_dev_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]"
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build:
      context: apps/ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-ai-service-token}
      AI_SERVICE_ENVIRONMENT: ${NODE_ENV:-development}
      AI_SERVICE_LOG_LEVEL: ${AI_SERVICE_LOG_LEVEL:-INFO}
      AI_SERVICE_DETECTOR: ${AI_SERVICE_DETECTOR:-yolox}
      AI_SERVICE_SENTINEL_CATALOG: ${AI_SERVICE_SENTINEL_CATALOG:-auto}
      AI_SERVICE_MAX_CLOUD_COVER: ${AI_SERVICE_MAX_CLOUD_COVER:-20}
    # Si el proceso muere (p. ej. sin memoria al procesar un escaneo), vuelve a levantarse solo.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Aplica migraciones y carga datos demo (solo si la base está vacía). Finaliza al terminar.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/database/bootstrap.js"]
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/main.js"]
    environment:
      <<: *api-env
      PORT: 4000
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      MAP_TILE_ORIGINS: ${MAP_TILE_ORIGINS:-https://tile.openstreetmap.org}
      ASSET_ORIGINS: ${ASSET_ORIGINS:-http://localhost:${MINIO_PORT:-9000}}
      SHOW_DEMO_CREDENTIALS: ${SHOW_DEMO_CREDENTIALS:-true}
      DEMO_LOGIN_EMAIL: ${DEMO_LOGIN_EMAIL:-maria.lopez@bancodelcampo.com.ar}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-AgroDemo2026!}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  minio-data:
